name: Fetch images from old site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download images listed in images/manifest.txt
        run: |
          set -u
          missing=0
          while read -r name url; do
            [ -z "$name" ] && continue
            echo "Fetching $name"
            if curl -fsSL -A "Mozilla/5.0" "$url" -o "images/$name"; then
              echo "  ok ($(stat -c %s "images/$name") bytes)"
            else
              echo "  MISSING $name  <-  $url"
              rm -f "images/$name"
              missing=$((missing+1))
            fi
          done < images/manifest.txt
          echo "Done. Missing: $missing"

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images
          git diff --cached --quiet && echo "Nothing new" || git commit -m "Add images fetched from old site"
          git push
